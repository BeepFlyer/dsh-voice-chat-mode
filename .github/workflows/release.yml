name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Check generated client
        run: node scripts/build-client.mjs --check

      - name: Run offline tests
        run: node test/host-route.mjs && node test/tools.mjs

      - name: Pack tarball and checksums
        run: |
          TGZ="$(npm pack --ignore-scripts | tail -n 1)"
          sha256sum "$TGZ" > SHA256SUMS.txt
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TGZ" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TGZ" SHA256SUMS.txt --generate-notes
          fi
